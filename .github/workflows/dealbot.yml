name: dealbot
# 상시 실행. 한 번 실행되면 약 5시간 40분 동안 켜져 있고, 끝나기 직전에 스스로 다음 실행을 시작합니다.
# - 수동 실행(Run workflow): 돌고 있는 봇을 멈추고 즉시 새로 시작
# - 예약 실행(30분마다, 예비용): 봇이 오류로 죽었을 때만 다시 띄움. GitHub이 자주 건너뛰므로 주 수단이 아님
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "실행 시간(시간). 비우면 5.6"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: 다른 실행 확인
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          others=$(gh run list -w dealbot -s in_progress --json databaseId -q '.[].databaseId' | grep -vx "${{ github.run_id }}" || true)
          if [ -n "$others" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "이미 실행 중인 봇이 있어 종료합니다."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for id in $others; do gh run cancel "$id" || true; done
          [ -n "$others" ] && sleep 20 || true   # 앞 실행이 기록을 저장할 시간
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.skip != '1'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.skip != '1'
        id: bot
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          git config user.name "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          python -m dealbot serve
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          SERVE_HOURS: ${{ inputs.hours || '5.6' }}
      - name: 다음 실행 이어서 시작
        # 정상 종료나 오류 종료면 다음 실행을 바로 시작 (수동으로 취소된 경우는 제외).
        # 시작하자마자 죽는 오류가 반복되지 않도록 5분 이상 돌았을 때만.
        if: ${{ !cancelled() && steps.gate.outputs.skip != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ran=$(( $(date +%s) - ${{ steps.bot.outputs.start || 0 }} ))
          if [ "$ran" -ge 300 ]; then gh workflow run dealbot.yml --ref main; echo "다음 실행 시작 요청"; else echo "실행 시간이 짧아 이어서 시작하지 않음 ($ran초)"; fi
